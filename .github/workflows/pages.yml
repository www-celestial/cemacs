name: pages

# The site of Cemacs, its book and the reference of its packages, as cesia doc --site makes them from this commit: built
# for each pull request, and published on GitHub Pages from main. It runs on the nightly Cesia, which Cemacs follows, as its
# release gives it. A block of the book that gives another value, or a [Name] that leads nowhere, stops the build, and the
# site in place stays as it was, as it does when the nightly Cesia can't be downloaded: the build fails then too.
on:
  push:
    branches: [main]
  pull_request:
  # By hand too, Run workflow on main: the site again, with a new nightly Cesia.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      built: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cesia nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cesia-linux-x86_64.tar.gz
          # A failed download fails the check: a green check means the site was built.
          gh release download nightly --repo www-celestial/cesia-lang --pattern "$archive*" --dir download
          (cd download && [ "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(cut -d' ' -f1 < "$archive.sha256")" ])
          mkdir -p "$HOME/.cesia"
          tar -xzf "download/$archive" -C "$HOME/.cesia"
          echo "$HOME/.cesia/bin" >> "$GITHUB_PATH"
      - name: Site
        id: site
        run: |
          cesia version
          # cesia.toml names user/, the folder of the person, which a clone doesn't have: it gets the template, as at a first start.
          tools/user.sh
          cesia doc --site _site
          echo "built=1" >> "$GITHUB_OUTPUT"
      # What the build keeps for itself: the programs of the book's pages and their folders, and what lets the next build
      # skip a page that didn't change.
      - name: Only the pages
        run: rm -rf _site/.run _site/.pages _site/.reference _site/.book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.built == '1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5