name: ci

# The suite of Cemacs on each push, against the latest stable Cesia and against the nightly one, as their releases give them:
# a change of Cesia that breaks Cemacs shows before a release of Cesia. A Cesia older than the one cesia.toml asks for is
# skipped, and says so: until a release catches up, only the nightly can run Cemacs.
# A push that changes only the docs runs pages.yml alone, which builds and checks the site; a newer push cancels the run
# in progress.
on:
  push:
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        cesia: [stable, nightly]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Cesia ${{ matrix.cesia }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.cesia }}
        run: |
          archive=cesia-linux-x86_64.tar.gz
          tag=$([ "$CHANNEL" = nightly ] && echo nightly || true)
          if ! gh release download $tag --repo www-celestial/cesia-lang --pattern "$archive*" --dir download; then
            echo "Cesia has no $CHANNEL release yet: nothing to test against."
            echo "NO_CESIA=1" >> "$GITHUB_ENV"
            exit 0
          fi
          (cd download && [ "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(cut -d' ' -f1 < "$archive.sha256")" ])
          mkdir -p "$HOME/.cesia"
          tar -xzf "download/$archive" -C "$HOME/.cesia"
          echo "$HOME/.cesia/bin" >> "$GITHUB_PATH"
          need=$(sed -n 's/^cesia = "\(.*\)"$/\1/p' cesia.toml | sed 's/[-+].*//')
          have=$("$HOME/.cesia/bin/cesia" version | cut -d' ' -f2 | sed 's/[-+].*//')
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "Cesia $CHANNEL is $have, older than the $need that cesia.toml asks for: nothing to test against."
            echo "NO_CESIA=1" >> "$GITHUB_ENV"
          fi
      # Cesia no longer ships SDL: built here once, kept in the cache while tools/sdl-libs.sh stays the same.
      - name: SDL3 and SDL3_ttf, cached
        if: env.NO_CESIA != '1'
        uses: actions/cache@v6
        with:
          path: .sdl
          key: sdl-${{ hashFiles('tools/sdl-libs.sh') }}
      - name: SDL3 and SDL3_ttf
        if: env.NO_CESIA != '1'
        run: |
          if [ ! -d .sdl/lib ]; then
            sudo apt-get update
            sudo apt-get install -y cmake libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
              libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev
            tools/sdl-libs.sh .sdl
          fi
          echo "LD_LIBRARY_PATH=$PWD/.sdl/lib" >> "$GITHUB_ENV"
      - name: Tests
        if: env.NO_CESIA != '1'
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cesia version
          tests/run.sh
